name = "lotto-analysis-backend"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[[d1_databases]]
binding = "DB"
database_name = "lotto_db"
database_id = "d879aa99-d304-4001-b3d9-67ab6605de57"

[triggers]
# cron 은 UTC 로 해석된다 (KST = UTC+9). 추첨 직후·한 시간 뒤·다음날 아침, 세 번 기회를 준다.
#   로또6/45  토 20:35 추첨 → 토 21:10·22:10 KST = 12:10·13:10 UTC
#   연금720+  목 19:05 추첨 → 목 19:40·20:40 KST = 10:40·11:40 UTC
#   매일 06:30 KST = 21:30 UTC — 위가 모두 실패했을 때 받아내는 그물
# sync 는 멱등이라 새 회차가 없으면 최신 회차 확인 요청만 나가고 끝난다.
# 무료 플랜 한도는 계정당 cron trigger 5개 (2026-09 확인). 여기서 3개를 쓴다.
# 요일은 약어로 쓴다. Cloudflare 는 1=일 ~ 7=토 라서 표준 cron(0=일, 6=토)의 숫자를 그대로
# 넣으면 하루씩 밀린다 — 실제로 "6"(토 의도)이 금요일에, "4"(목 의도)가 수요일에 돌았다.
# 시각은 UTC 다 (KST = UTC+9).
crons = ["10 12,13 * * SAT", "40 10,11 * * THU", "30 21 * * *"]

# 구글 OAuth 클라이언트 ID (웹 애플리케이션 유형). 공개 값이라 secret 이 아니다 —
# 브라우저가 로그인 버튼을 그릴 때 그대로 노출된다. 신뢰는 구글이 서명한 ID 토큰에서 오고,
# 서버는 이 값과 토큰의 aud 가 같은지 검사한다.
#
# Google Cloud Console 의 "승인된 JavaScript 원본" 에 아래 두 주소가 등록되어 있어야 한다:
#   https://lotto-frontend.pages.dev
#   http://localhost:5199   (개발용)
#
# 빈 문자열로 두지 말 것 — [vars] 에 선언된 값은 .dev.vars 와 대시보드 설정을 모두 덮는다.
# 선언을 지우면 로그인 버튼이 나타나지 않고 익명 보관함만 쓰인다.
[vars]
GOOGLE_CLIENT_ID = "915801138159-u0f2epij7hu8mm44uh18os72q7nekb05.apps.googleusercontent.com"
