name = "lotto-analysis-backend"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[[d1_databases]]
binding = "DB"
database_name = "lotto_db"
database_id = "d879aa99-d304-4001-b3d9-67ab6605de57"

[triggers]
# 매일 21:30 UTC = 06:30 KST 에 로또·연금을 모두 동기화한다.
# sync 는 멱등이라 새 회차가 없으면 최신 회차 확인 요청만 나간다. 추첨 다음 날 실패해도 이튿날 다시 받는다.
crons = ["30 21 * * *"]
